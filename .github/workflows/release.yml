name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Check release branding
        run: node scripts/check-release-branding.mjs

      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match application version $version. Expected $expectedTag."
          }

      - name: Run tests
        run: npm test

  build:
    name: Build ${{ matrix.artifact }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact: windows-x64
            args: '--bundles nsis,msi'
            signingIdentity: ''
            scanPath: src-tauri/target/release/bundle
            assetPath: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - platform: macos-latest
            artifact: macos-arm64
            args: '--target aarch64-apple-darwin --bundles dmg'
            signingIdentity: '-'
            scanPath: src-tauri/target/aarch64-apple-darwin/release/bundle
            assetPath: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: macos-latest
            artifact: macos-x64
            args: '--target x86_64-apple-darwin --bundles dmg'
            signingIdentity: '-'
            scanPath: src-tauri/target/x86_64-apple-darwin/release/bundle
            assetPath: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.signingIdentity }}
        with:
          args: ${{ matrix.args }}

      - name: Check packaged artifacts
        run: node scripts/check-release-branding.mjs "${{ matrix.scanPath }}"

      - name: Upload verified installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.assetPath }}
          if-no-files-found: error

  draft-release:
    name: Create draft prerelease
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: lts/*

      - name: Download verified installers
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: release-assets

      - name: Recheck release assets
        run: node scripts/check-release-branding.mjs release-assets

      - name: Create or update draft prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = Get-ChildItem release-assets -Recurse -File | ForEach-Object { $_.FullName }
          if ($assets.Count -lt 4) {
            throw "Expected at least four installer assets, found $($assets.Count)."
          }

          $notes = @"
          DailyTodos 的首个公开测试版本。

          下载说明：
          - Windows x64：推荐使用 setup.exe，msi 为备用安装格式。
          - macOS Apple Silicon：适用于 M 系列芯片。
          - macOS Intel：适用于 Intel 芯片。

          安全提示：
          - Windows 版本尚未进行代码签名，SmartScreen 可能要求手动确认运行。
          - macOS 版本使用临时签名，首次启动时可能需要在“隐私与安全性”中允许。

          此测试版本暂不支持应用内自动更新。
          "@

          if (gh release view $tag 2>$null) {
            gh release edit $tag --draft --prerelease --title "DailyTodos $tag" --notes $notes
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --verify-tag --draft --prerelease --title "DailyTodos $tag" --notes $notes
          }
